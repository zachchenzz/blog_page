title: Zach's Tech Blog
description: IT support notes, troubleshooting guides, Microsoft 365 tips, and personal learning logs
theme: minima

author:
  name: Zach Chen
  email: your-email@example.com

url: "https://yourusername.github.io"
baseurl: ""

lang: en

# Show pages in the top navigation
header_pages:
  - about.md

# Minima options
minima:
  skin: auto
  social_links:
    - title: GitHub
      icon: github
      url: https://github.com/yourusername
    - title: LinkedIn
      icon: linkedin
      url: https://www.linkedin.com/in/your-link

# Plugins supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Blog settings
show_excerpts: true
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/

# Exclude unnecessary files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
